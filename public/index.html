<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>College Events</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
      header{background:#1f6feb;color:#fff;padding:12px 16px}
      main{padding:16px}
      .card{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:6px}
      .btn{background:#1f6feb;color:#fff;padding:8px 12px;border:none;border-radius:4px;cursor:pointer}
      form label{display:block;margin-top:8px}
      input,textarea,select{width:100%;padding:8px;margin-top:4px}
    </style>
  </head>
  <body>
    <header>
      <h1>College Events</h1>
    </header>
    <main>
      <section id="auth">
        <h2>Login / Signup</h2>
        <div id="userInfo"></div>
        <form id="loginForm">
          <label>Email<input type="email" name="email" required></label>
          <label>Password<input type="password" name="password" required></label>
          <button class="btn" type="submit">Login</button>
        </form>
        <hr>
        <form id="signupForm">
          <label>Name<input name="name" required></label>
          <label>Email<input type="email" name="email" required></label>
          <label>Password<input type="password" name="password" required></label>
          <button class="btn" type="submit">Sign up</button>
        </form>
      </section>

      <section id="createEvent">
        <h2>Create Event</h2>
        <form id="eventForm">
          <label>Title<input name="title" required></label>
          <label>Description<textarea name="description"></textarea></label>
          <label>Start<input name="start_at" type="datetime-local"></label>
          <label>End<input name="end_at" type="datetime-local"></label>
          <label>Venue<input name="venue"></label>
          <label>College ID<input name="college_id" type="number"></label>
          <label>Capacity<input name="capacity" type="number"></label>
          <button class="btn" type="submit">Create</button>
        </form>
      </section>

      <section>
        <h2>Events</h2>
        <div id="events"></div>
      </section>
    </main>
    <script>
      const api = (path, opts={}) => fetch('/api'+path, opts).then(r => r.json());
      let token = localStorage.getItem('token');

      function setToken(t, user){
        token = t; if (t) localStorage.setItem('token', t); else localStorage.removeItem('token');
        document.getElementById('userInfo').textContent = user ? `Hello ${user.name}` : '';
      }

      document.getElementById('loginForm').addEventListener('submit', async e =>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { email: fd.get('email'), password: fd.get('password') };
        const res = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data = await res.json();
        if (data.token) setToken(data.token, data.user);
        loadEvents();
      });

      document.getElementById('signupForm').addEventListener('submit', async e =>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { name: fd.get('name'), email: fd.get('email'), password: fd.get('password') };
        const res = await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data = await res.json();
        if (data.token) setToken(data.token, data.user);
        loadEvents();
      });

      document.getElementById('eventForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = Object.fromEntries(fd.entries());
        await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json','Authorization': token?`Bearer ${token}`:''},body:JSON.stringify(body)});
        loadEvents();
      });

      async function loadEvents(){
        const list = await api('/events');
        const el = document.getElementById('events'); el.innerHTML='';
        list.forEach(ev=>{
          const d = document.createElement('div'); d.className='card';
          d.innerHTML = `<h3>${ev.title}</h3><p>${ev.description||''}</p><p>${ev.start_at||''} @ ${ev.venue||''}</p><button class="btn" data-id="${ev.id}">Register</button>`;
          el.appendChild(d);
        });
        document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click', async e=>{
          const id = e.target.dataset.id;
          await fetch(`/api/events/${id}/register`,{method:'POST',headers:{'Authorization': token?`Bearer ${token}`:''}});
          alert('Registered');
        }));
      }

      loadEvents();
    </script>
  </body>
</html>
