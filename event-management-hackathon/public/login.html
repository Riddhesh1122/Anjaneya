<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EventHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" style="display:none;"></div>

  <header>
    <div class="container">
      <h1>EventHub</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="create-event.html">Create Event</a>
        <a href="login.html" class="active">Login</a>
      </nav>
    </div>
  </header>

  <section class="form-section">
    <div class="container max-w-sm">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to manage your events and registrations.</p>
      
      <div id="login-message"></div>

      <form id="login-form" class="card-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-full">Sign In</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 EventHub — Built for Hackathon</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
